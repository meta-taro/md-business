[package]
name = "md-business-desktop"
version = "0.21.0"
description = "md-business desktop app (Tauri 2 + SvelteKit)"
authors = ["meta-taro"]
license = "MIT"
repository = "https://github.com/meta-taro/md-business"
edition = "2021"
rust-version = "1.77.2"

# Tauri は main バイナリと、テスト/モバイルで共有する lib の両構成を取る。
[lib]
name = "md_business_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
# フォルダ選択ダイアログ（Tauri 公式プラグイン・MIT/Apache-2.0）。open のみ利用。
tauri-plugin-dialog = "2"
# 外部 URL を既定ブラウザで開く（Tauri 公式プラグイン・MIT/Apache-2.0）。open-url のみ利用。
tauri-plugin-opener = "2"
# 更新適用後にアプリを再起動するためのプロセス制御プラグイン。
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# 外部編集の即時検知に使うファイル監視。notify 6.x は MSRV 1.60 で本クレート(1.77.2)に
# 収まる。debouncer-full は短時間の連続イベントを束ね、リネームの From/To も解決する。
notify = "6.1"
notify-debouncer-full = "0.3"
# ファイル情報の SHA-256（RustCrypto・MIT/Apache-2.0）。MSRV 1.41 で本クレート(1.77.2)に収まる。
# 自前実装すると検証コストの割に得るものが無いので、標準的な実装を使う。
sha2 = "0.10"
# ブラウザ表示の URL に入れる合鍵に使う OS 乱数（rust-random・MIT/Apache-2.0）。
# MSRV 1.63 で本クレート(1.77.2)に収まる。OS の口を呼ぶだけのクレートで、
# 自前で並びを作ると先読みできる鍵になりかねないため使う。
getrandom = "0.3"
# 撮った画像は base64 で返ってくるので、それを戻す（MIT/Apache-2.0）。
# 自前で書ける規模だが、境目（`=` の詰め方・改行の混入）を間違えても
# 「少し壊れた画像」として出てしまい気づけないので、標準的な実装を使う。
base64 = "0.22"

# 画像出力は OS ごとに撮る口が違う。Windows は WebView2 の DevTools Protocol を叩く。
# どちらも Tauri が既に連れてきているものなので、配布物は増えない。
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_WindowsProgramming",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
] }

# 自動アップデートはデスクトップ専用（モバイルは対象外）。GitHub Releases の
# 署名付き成果物を取得・検証・適用する。ターゲット cfg でデスクトップに限定する。
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
# 二重起動を止め、後から渡された起動引数を既に動いている窓へ回すプラグイン
# （Tauri 公式・MIT/Apache-2.0）。外から「このファイルを開いて」と頼まれる経路で使う。
# deep-link 機能を入れると、既に動いているときに共有リンクも同じ窓へ回る。
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
# 共有リンク（md-business://...）を OS から受け取るプラグイン（Tauri 公式・MIT/Apache-2.0）。
# Windows / Linux は起動引数、macOS は OS のイベントで届くので、その差をここで吸収する。
tauri-plugin-deep-link = "2"

# リリースビルドはサイズ最適化（デスクトップ配布容量を抑える）。
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
