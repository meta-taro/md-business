name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile 2>&1 | tee install.log
          exit ${PIPESTATUS[0]}

      - name: Verify install-script policy
        # onlyBuiltDependencies: [] が pnpm-workspace.yaml で効いていることを継続検証する。
        # 依存パッケージの postinstall が走るとサプライチェーン防御ポリシー違反。
        run: |
          if grep -qE "(Thank you for using core-js|^[^[:space:]]+@[^[:space:]]+ postinstall\$|Running .* postinstall)" install.log; then
            echo "::error::Install script executed during pnpm install - onlyBuiltDependencies policy violated"
            grep -nE "(Thank you for using core-js|postinstall)" install.log || true
            exit 1
          fi
          echo "OK: no transitive postinstall scripts ran during install"

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test:run

      - name: Build
        run: pnpm build

  rust:
    # デスクトップアプリの Rust 側は pnpm のタスクに含まれないため、別ジョブで検査する。
    #
    # Windows ランナーを使う理由: Tauri のビルドに必要な WebView2 が同梱されており、
    # system パッケージの導入が要らない。Linux は libwebkit2gtk 系の apt 依存が必要で、
    # パッケージ名がディストロ更新で変わるとビルドが壊れる。配布ビルド（release.yml）も
    # Windows / macOS のみで Linux 面を持たないため、テストのためだけに検証対象の OS を
    # 増やすと、壊れても気づけない経路ができてしまう。
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v6

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v6
        with:
          version: 9.12.0

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: "pnpm"

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      # tauri.conf.json が MCP サイドカーを bundle resource に指定しており、build
      # script が resource path の実体を検査するため、cargo を回す前に生成しておく。
      # turbo の bundle タスクは依存パッケージの build に依存しているので、この 1 本で
      # 必要な dist も揃う（ワークスペース全体をビルドするより対象が小さい）。
      #
      # frontendDist の方はテストプロファイルでは要求されないため、フロントエンドの
      # ビルド成果物は不要。
      - name: Bundle MCP sidecar
        working-directory: .
        run: pnpm exec turbo run bundle --filter=@md-business/mcp-server

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        run: cargo test --locked
