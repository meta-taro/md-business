name: OSS guard

# 公開物に内部運用の記述（担当者名・日付帰属コメント・内部ルール参照・内部ハンドル）が
# 混入していないかを継続検証する。コミット時フックは新規追加分をブロックし、この日次スキャンは
# 追跡ファイル全体を再検査する。

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 21 * * *" # 毎日 06:00 JST
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # identity スキャンが PR の全コミットを辿るため、浅いクローンにしない。
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Unit tests (scanner patterns)
        run: node --test "scripts/oss-guard/*.test.mjs"

      - name: Scan tree for internal references
        run: node scripts/oss-guard/check-tree.mjs --strict

      # merge されると author/committer は履歴の書き換えなしには直せない。main は
      # PR 運用なので、ここが公開前の最後のゲートになる。
      # 範囲は PR の新規コミットのみ（公開済みの既存履歴は対象外）。
      - name: Scan commit identity (pull request only)
        if: github.event_name == 'pull_request'
        env:
          # 式展開はシェルへ直接埋めず env 経由で渡す。
          RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: node scripts/oss-guard/check-identity.mjs --range "$RANGE"
